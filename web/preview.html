<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: "Segoe UI", sans-serif; font-size: 14px; line-height: 1.6; margin: 12px; color: #1a1a1a; }
pre { margin: 0; padding: 0; border-radius: 4px; }
code { background: #f4f4f4; padding: 1px 4px; border-radius: 3px; }
pre code { background: none; padding: 0; }
blockquote { border-left: 4px solid #ccc; margin: 0; padding-left: 14px; color: #666; }
table { border-collapse: collapse; }
th, td { border: 1px solid #ccc; padding: 6px 12px; }
a { color: #0366d6; }
h1 { border-bottom: 1px solid #e1e4e8; padding-bottom: 4px; }
</style>
<script src="mermaid.min.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  try {
    if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined' && qt.webChannelTransport) {
      new QWebChannel(qt.webChannelTransport, function (channel) {
        window.mdBridge = channel.objects.bridge;
      });
    }
  } catch (e) { console.error('bridge', e); }
</script>
<script>
  window.mermaidRender = function (html) {
    var el = document.getElementById('content');
    el.innerHTML = html;
    try {
      mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose', suppressErrorRendering: true });
      var nodes = el.querySelectorAll('pre.mermaid, code.language-mermaid, code.mermaid');
      Array.prototype.forEach.call(nodes, function (n, i) {
        n.dataset.diaIndex = String(i + 1);
        n.dataset.src = n.textContent;
      });
      var seq = window.mermaidRender.seq = (window.mermaidRender.seq || 0) + 1;
      var gen = window.mermaidRender.gen = (window.mermaidRender.gen || 0) + 1;
      var pending = nodes.length;
      var failed = false;
      function done() {
        pending -= 1;
        if (pending <= 0 && gen === window.mermaidRender.gen) {
          el.dataset.mermaidState = failed ? 'error' : 'ok';
        }
      }
      Array.prototype.forEach.call(nodes, function (n, i) {
        var src = n.textContent;
        var id = 'mmd' + (seq + i);
        mermaid.render(id, src).then(function (r) {
          if (n.isConnected) {
            var holder = document.createElement('div');
            holder.id = id;
            holder.dataset.diaIndex = n.dataset.diaIndex;
            holder.dataset.src = src;
            holder.innerHTML = r.svg;
            n.replaceWith(holder);
          }
          done();
        }).catch(function (err) {
          failed = true;
          done();
          console.error('mermaid', err);
        });
      });
      if (pending === 0) {
        el.dataset.mermaidState = gen === window.mermaidRender.gen ? 'ok' : 'none';
      }
    } catch (e) { console.error('mermaid', e); }
  };
</script>
<script>
  function flushPending() {
    if (!document.body) return;
    var ph = document.body.getAttribute('data-pending-html');
    if (ph !== null) {
      document.body.removeAttribute('data-pending-html');
      window.mermaidRender(ph);
    }
  }
  if (document.body) {
    flushPending();
  } else {
    document.addEventListener('DOMContentLoaded', flushPending);
  }
  document.addEventListener('dblclick', function (ev) {
    if (!window.mdBridge || !ev.target || !ev.target.closest) return;
    var h = ev.target.closest('[data-dia-index]');
    if (h) {
      window.mdBridge.editMermaid(Number(h.dataset.diaIndex), h.dataset.src || '');
    }
  });
</script>
</head>
<body>
<div id="content"></div>
</body>
</html>
